<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SayByMe – I Have Something to Say 🥺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="preview.css?v=120">
<style>
  html, body {
    width: 100% !important;
    height: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    overflow: hidden !important;
    scrollbar-width: none !important;
    -ms-overflow-style: none !important;
    background: #f2e2ff !important;
  }
  html::-webkit-scrollbar, body::-webkit-scrollbar, *::-webkit-scrollbar {
    display: none !important;
    width: 0 !important;
    height: 0 !important;
  }
</style>
</head>
<body>

<!-- Audio Player -->
<audio id="bgmAudio" src="assets/The-Open-Sky-chosic.com_.mp3" loop preload="auto"></audio>

<!-- Floating Audio Mute / Unmute Button -->
<button type="button" class="audio-btn" id="audioBtn" aria-label="Toggle background music">
  <svg id="audioIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5c2482" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
    <line x1="23" y1="9" x2="17" y2="15"></line>
    <line x1="17" y1="9" x2="23" y2="15"></line>
  </svg>
</button>

<div class="preview-viewport-center">
  
  <!-- INTRO APOLOGY PREVIEW SCREEN (MATCHING REFERENCE EXACTLY) -->
  <main class="intro-screen-stage" id="sceneIntro">
    
    <!-- Floating Emojis Layer (Soft romantic & apology floating elements) -->
    <div class="floating-emojis-container" aria-hidden="true">
      <span class="float-emoji emoji-tl-flower">🌸</span>
      <span class="float-emoji emoji-tl-bouquet">💐</span>
      <span class="float-emoji emoji-tc-pinkheart">💗</span>
      <span class="float-emoji emoji-tc-purpleheart">💜</span>
      <span class="float-emoji emoji-tr-flower">🌸</span>
      <span class="float-emoji emoji-tr-sparkle">✨</span>
      <span class="float-emoji emoji-ml-pleading">🥺</span>
      <span class="float-emoji emoji-mr-envelope">💌</span>
      <span class="float-emoji emoji-mr-heart">💖</span>
      <span class="float-emoji emoji-mr-sparkle">✨</span>
      <span class="float-emoji emoji-br-hands">🙏</span>
      <span class="float-emoji emoji-br-sparkle">✨</span>
      <span class="float-emoji emoji-bl-heart">💕</span>
    </div>

    <!-- Centered Content: Teddy Bear + Heading + Subtitle -->
    <div class="intro-center-group" id="introCenterGroup" role="button" tabindex="0" aria-label="Click to read apology letter">
      
      <div class="intro-teddy-wrapper">
        <img src="images/sorry-teddy-sticker@2x.png" alt="I'm sorry bear" class="intro-teddy-img" id="introTeddyImg" width="180" height="205">
      </div>

      <h1 class="intro-heading">
        <span id="recipientName">s</span>... I Have Something to Say 🥺
      </h1>

      <p class="intro-subtitle" id="introSubtitle">
        I just want a chance to say this properly
      </p>

    </div>

    <!-- Frosted Glass Play Button at Bottom Center -->
    <button type="button" class="btn-play-trigger" id="btnPlayTrigger" aria-label="Open apology letter">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="#ffffff" class="play-icon-triangle">
        <polygon points="8 5 19 12 8 19"></polygon>
      </svg>
    </button>

  </main>

</div>

<script src="convex-client.js"></script>
<script src="bgm.js"></script>
<script src="preview.js?v=120"></script>
</body>
</html>
